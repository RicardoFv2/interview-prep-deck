<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Utexo products + SDK · Interview Prep</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg0:#070b12;--panel:rgba(18,26,40,.92);--panel-border:rgba(120,160,220,.14);--text:#eef3fb;--muted:#8b9bb3;--accent:#34d399;--accent2:#6eb6ff;--radius:20px;--shadow:0 24px 80px rgba(0,0,0,.45);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"DM Sans",system-ui,sans-serif;color:var(--text);background:radial-gradient(1000px 500px at 0% 0%,rgba(52,211,153,.16),transparent 50%),radial-gradient(800px 500px at 100% 0%,rgba(110,182,255,.12),transparent 45%),var(--bg0);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--panel-border);background:rgba(7,11,18,.75);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;font-size:11px;color:#061018}
.brand h1{margin:0;font-size:14px;font-weight:600}.brand p{margin:0;font-size:12px;color:var(--muted)}
.sections{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}.sec{border:1px solid transparent;background:transparent;color:var(--muted);font:500 12px/1 "DM Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}.sec.on{color:var(--text);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35)}
.btn{border:1px solid var(--panel-border);background:rgba(255,255,255,.03);color:var(--text);border-radius:10px;padding:8px 12px;font:500 12px/1 "DM Sans",sans-serif;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(110,182,255,.2));border-color:rgba(52,211,153,.4)}
.main{display:grid;place-items:center;padding:20px 16px;min-height:0}
.slide{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,4vw,44px);animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag{display:inline-flex;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:999px;padding:5px 10px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:clamp(1.35rem,3vw,1.85rem);letter-spacing:-.02em}p,li{font-size:clamp(.96rem,1.5vw,1.06rem);line-height:1.55}.muted{color:var(--muted)}.big{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.45}
ul,ol{margin:10px 0;padding-left:1.15em}li{margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:rgba(7,11,18,.55);border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px}.card.warn{border-color:rgba(251,191,36,.4)}.mono{font-family:"JetBrains Mono",monospace;font-size:.9em;color:#b9dcff}
table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--panel-border);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.q{font-size:clamp(1.1rem,2.2vw,1.32rem);font-weight:600;margin:4px 0 16px}.answer{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);border-radius:14px;padding:14px 16px;margin-top:8px}.answer.hidden{display:none}
.reveal{margin-top:8px;border:1px dashed rgba(52,211,153,.45);background:transparent;color:var(--accent);border-radius:12px;padding:12px 14px;width:100%;font:600 14px/1 "DM Sans",sans-serif;cursor:pointer}
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--panel-border);background:rgba(7,11,18,.8)}
.nav{display:flex;gap:8px}.nav .btn{min-width:44px;min-height:40px}.center-meta{text-align:center;color:var(--muted);font-size:12px}
.progress{height:4px;width:min(280px,40vw);margin:0 auto 6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.hint{justify-self:end;color:var(--muted);font-size:11px}kbd{font-family:"JetBrains Mono",monospace;font-size:10px;background:rgba(255,255,255,.06);border:1px solid var(--panel-border);border-radius:5px;padding:2px 5px}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand"><div class="logo">UTX</div><div><h1>Utexo products + SDK</h1><p>Docs-grounded study deck</p></div></div>
  <nav class="sections" id="sections"></nav>
  <div style="display:flex;gap:8px">
    <a class="btn" href="./index.html">Basics</a>
    <a class="btn" href="./study-deck-advanced.html">Advanced</a>
    <button class="btn" id="btnQuiz" type="button">Quiz</button>
    <button class="btn primary" id="btnFs" type="button">Full</button>
  </div>
</header>
<main class="main" id="main"></main>
<footer class="bottom">
  <div class="nav"><button class="btn" id="prev" type="button">←</button><button class="btn" id="next" type="button">→</button></div>
  <div class="center-meta"><div class="progress"><i id="prog"></i></div><div id="counter">1/1</div></div>
  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> · <kbd>H</kbd> quiz</div>
</footer>
</div>
<script>
const slides=[
{section:"Suite",html:`<span class="tag">Product suite</span><h2>Four products</h2><table><tr><th>Product</th><th>Job</th></tr><tr><td><strong>SDK</strong></td><td>Native USDT / RGB + LN client libraries</td></tr><tr><td><strong>Cloud</strong></td><td>Managed RGB Lightning Nodes</td></tr><tr><td><strong>Mint</strong></td><td>Cross-chain USDT → RGB USDT on Bitcoin</td></tr><tr><td><strong>Swap</strong></td><td>Non-custodial BTC↔USDT (HotPot intents)</td></tr></table><p class="muted">docs.utexo.com/getting-started/product-suite</p>`},
{section:"Suite",html:`<span class="tag">Architecture</span><h2>Layered stack</h2><table><tr><th>Layer</th><th>Role</th></tr><tr><td>Bitcoin</td><td>Finality / dispute anchor</td></tr><tr><td>Lightning</td><td>Fast off-chain execution</td></tr><tr><td>RGB</td><td>Assets + client-side validation</td></tr><tr><td>Utexo</td><td>Routing, liquidity, SDK/API</td></tr><tr><td>Mint / Swap</td><td>Inbound USDT · BTC↔USDT FX</td></tr></table>`},
{section:"SDK",html:`<span class="tag">SDK family</span><h2>Pick the right package</h2><table><tr><th>Package</th><th>Use</th></tr><tr><td class="mono">@utexo/wdk-rgb-lightning</td><td><strong>New Node</strong> — LN + RGB (beta)</td></tr><tr><td class="mono">@utexo/wdk-wallet-rgb</td><td>On-chain RGB issuance (stable)</td></tr><tr><td class="mono">@utexo/rgb-sdk-web</td><td>Browser WASM</td></tr><tr><td class="mono">@utexo/rgb-sdk-rn</td><td>React Native</td></tr><tr><td class="mono">@utexo/rgb-sdk</td><td class="muted">Archived Jul 2026 — avoid</td></tr></table>`},
{section:"SDK",quiz:true,html:`<span class="tag">Hard Q</span><p class="q">New Node.js integration in 2026 — which package, and why not rgb-sdk?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><span class="mono">@utexo/wdk-rgb-lightning</span>. Docs: <span class="mono">@utexo/rgb-sdk</span> source archived 28 Jul 2026; quickstart says do not use for new Node work. Don’t copy Web/RN UTEXOWallet APIs into WDK.</div>`},
{section:"SDK",html:`<span class="tag">WDK lifecycle</span><h2>Node path you must narrate</h2><ol><li><span class="mono">WalletManagerRgbLightning(mnemonic, {network, dataDir})</span></li><li><span class="mono">getAccount(0)</span></li><li><span class="mono">unlock</span> — indexer <em>or</em> bitcoind RPC (not both) + proxy + announce</li><li>Peers → channels → invoices / RGB</li><li><span class="mono">manager.dispose()</span></li></ol>`},
{section:"SDK",html:`<span class="tag">SDK concepts</span><h2>Vanilla vs colored</h2><div class="grid"><div class="card"><h3>Vanilla</h3><p>Normal BTC path — fees, funding. <span class="mono">getAddress()</span></p></div><div class="card"><h3>Colored</h3><p>RGB allocations on UTXOs. Need <span class="mono">createUtxos()</span> after funding.</p></div></div><p class="muted" style="margin-top:12px">Amounts = integer base units = <span class="mono">10 ** precision</span> per display unit.</p>`},
{section:"SDK",html:`<span class="tag">RGB invoices</span><h2>Blinded vs witness</h2><ul><li><strong>Blinded</strong> — common; sender pays invoice directly</li><li><strong>Witness</strong> — sender must pass <span class="mono">witnessData.amountSats</span></li><li>WDK: <span class="mono">createRgbInvoice</span> + <span class="mono">transfer()</span></li><li>Web/RN: different method names — don’t mix</li></ul>`},
{section:"SDK",html:`<span class="tag">Lightning</span><h2>WDK payment surface</h2><ul><li><span class="mono">createInvoice</span> / <span class="mono">sendPayment</span></li><li>HODL invoices for offline receive</li><li>LSP / async: <span class="mono">lspBaseUrl</span> + token; inbound OK; outbound async still in development</li><li>Init alone ≠ channels — need peer/channel or LSP</li></ul>`},
{section:"SDK",quiz:true,html:`<span class="tag">Hard Q</span><p class="q">Why separate dataDir for wdk-wallet-rgb vs wdk-rgb-lightning?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer>Both use rgb-lib SQLite with an exclusive lock; they do not share asset records. Docs: give each module its own dataDir. Issuance → wallet-rgb; channels/invoices → rgb-lightning.</div>`},
{section:"Cloud",html:`<span class="tag">Cloud / RLN</span><h2>Managed vs self-hosted</h2><ul><li>Cloud: provision, upgrade, destroy RLN; mTLS or API token</li><li>Backup/restore + webhooks</li><li>VSS / VLS — keys &amp; backup boundaries matter</li><li>Ask in interview: SDK embed vs Cloud API vs Mint/Swap ownership</li></ul>`},
{section:"MintSwap",html:`<span class="tag">Mint + Swap</span><h2>Talking points</h2><div class="grid"><div class="card"><h3>Mint</h3><p>USDT from EVM/Tron/(USDT0) → <strong>native RGB USDT</strong>. Architecture: TEE federation, connectors, BTC relay SPV.</p></div><div class="card"><h3>Swap</h3><p>HotPot: quote → intent → sign → resolver escrow → fulfill or refund. Atomic, non-custodial.</p></div></div>`},
{section:"Practice",quiz:true,html:`<span class="tag">Practice</span><p class="q">60s: What is Utexo?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer>Coordination/execution layer for Bitcoin-native USDT: RGB assets, Lightning speed, Bitcoin finality — shipped as SDK, Cloud RLN, Mint, and Swap so apps don’t assemble the stack alone.</div>`},
{section:"Practice",quiz:true,html:`<span class="tag">Practice</span><p class="q">Week-1 trial plan tied to docs?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer>Pick correct package → run official quickstart on signet/utexo → vertical slice (RGB invoice or LN invoice+status) → log real errors (unlock, locked, pending, no channel) → ask which product area the tech expert owns.</div>`},
{section:"Practice",html:`<span class="tag">Next</span><h2>Study loop</h2><ol><li>Read <span class="mono">08-utexo-products-sdk.md</span></li><li>Redraw suite + stack from memory</li><li>Narrate WDK unlock → pay flow</li><li>Open docs only to verify gaps</li></ol><p class="muted" style="margin-top:14px">Sources: docs.utexo.com product-suite, architecture, SDK overview, WDK pages</p>`}
];
const main=document.getElementById('main'),prog=document.getElementById('prog'),counter=document.getElementById('counter'),sectionsEl=document.getElementById('sections'),btnQuiz=document.getElementById('btnQuiz');
let i=0,quizMode=true,touchX=null;
[...new Set(slides.map(s=>s.section))].forEach(name=>{const b=document.createElement('button');b.className='sec';b.type='button';b.textContent=name;b.dataset.section=name;b.onclick=()=>{i=slides.findIndex(s=>s.section===name);render()};sectionsEl.appendChild(b)});
function render(){const slide=slides[i];main.innerHTML=`<article class="slide">${slide.html}</article>`;counter.textContent=`${i+1} / ${slides.length}`;prog.style.width=`${((i+1)/slides.length)*100}%`;[...sectionsEl.children].forEach(el=>el.classList.toggle('on',el.dataset.section===slide.section));document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;bindReveal();applyQuiz()}
function bindReveal(){main.querySelectorAll('[data-reveal]').forEach(btn=>btn.addEventListener('click',()=>{const ans=btn.parentElement.querySelector('[data-answer]');if(!ans)return;ans.classList.remove('hidden');btn.remove()}))}
function applyQuiz(){btnQuiz.classList.toggle('primary',quizMode);btnQuiz.textContent=quizMode?'Quiz on':'Quiz';main.querySelectorAll('[data-answer]').forEach(ans=>{if(quizMode&&slides[i].quiz){ans.classList.add('hidden');if(!ans.parentElement.querySelector('[data-reveal]')){const btn=document.createElement('button');btn.className='reveal';btn.type='button';btn.dataset.reveal='1';btn.textContent='Reveal';ans.before(btn);bindReveal()}}})}
function next(){if(i<slides.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;btnQuiz.onclick=()=>{quizMode=!quizMode;render()};document.getElementById('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}if(e.key==='h'||e.key==='H'){quizMode=!quizMode;render()}if(e.key==='f'||e.key==='F')document.getElementById('btnFs').click()});
main.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});main.addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].screenX-touchX;touchX=null;if(Math.abs(dx)<50)return;if(dx<0)next();else prev()},{passive:true});
render();
</script>
</body>
</html>
