<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"DM Sans",system-ui,sans-serif;color:var(--text);background:radial-gradient(1000px 500px at 0% 0%,rgba(245,158,11,.16),transparent 50%),radial-gradient(800px 500px at 100% 0%,rgba(110,182,255,.12),transparent 45%),var(--bg0);overflow:hidden}

.slide{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,4vw,44px);animation:rise .28s ease}

h2{margin:0 0 12px;font-size:clamp(1.35rem,3vw,1.85rem);letter-spacing:-.02em}h3{margin:0 0 6px;font-size:1rem}p,li{font-size:clamp(.96rem,1.5vw,1.06rem);line-height:1.55}.muted{color:var(--muted)}.big{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.45}
ul,ol{margin:10px 0;padding-left:1.15em}li{margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:rgba(7,11,18,.55);border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px}.card.warn{border-color:rgba(251,191,36,.4)}.card.good{border-color:rgba(52,211,153,.35)}.mono{font-family:"JetBrains Mono",monospace;font-size:.9em;color:#b9dcff}
table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--panel-border);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}

.nav{display:flex;gap:8px}.nav .btn{min-width:44px;min-height:40px}.center-meta{text-align:center;color:var(--muted);font-size:12px}

<body>
<div id="app">
<header class="top">
  <div class="brand"><div class="logo">AM</div><div><h1>Mañana · cram</h1><p>Habla en inglés · timer en voz alta</p></div></div>
  <nav class="sections" id="sections"></nav>
  <div style="display:flex;gap:8px">
    <a class="btn" href="./study-deck-utexo.html">Utexo</a>
    <a class="btn" href="./study-deck.html">Basics</a>

    <button class="btn primary" id="btnFs" type="button">Full</button>
  </div>

<main class="main" id="main"></main>
<footer class="bottom">
  <div class="nav"><button class="btn" id="prev" type="button">←</button><button class="btn" id="next" type="button">→</button></div>

</footer>

<script>
const slides=[
{section:"Plan",html:`<span class="tag">Hoy</span><h2>No leas ALL-IN-ONE. Habla.</h2><table><tr><th>Bloque</th><th>Tiempo</th><th>Qué</th></tr><tr><td>A Producto</td><td>40m</td><td>Suite + trampas SDK</td></tr><tr><td>B Lightning</td><td>30m</td><td>90s + liquidez + no-route</td></tr><tr><td>C RGB + settle</td><td>25m</td><td>60s + custody</td></tr><tr><td>D STAR</td><td>30m</td><td>2–3 stories <em>tuyas</em></td></tr><tr><td>E Pitch</td><td>15m</td><td>Trial + 4 preguntas</td></tr><tr><td>F Mock</td><td>15m</td><td>Timer 10 min</td></tr></table><p class="muted">Mañana, 30 min: solo scripts + 4 productos + paquete Node.</p>`},
{section:"Plan",html:`<span class="tag">Barra de pase</span><h2>El screen es corto. Esto basta.</h2><ul><li>Liquidez correcta (capacity ≠ direction)</li><li>No inventar experiencia ni internals de Utexo</li><li>RGB: modelo + gap honesto + plan week-1</li><li>Una pregunta de producto nítida</li></ul><p class="muted">Boosty / Utexo · tech-expert → pasantía 2–3 meses. CVs enviados en julio.</p>`},

{section:"Utexo",quiz:true,html:`<span class="tag">60s</span><p class="q">What is Utexo? (inglés, de pie)</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">Publicly, Utexo is a coordination layer for Bitcoin-native USDT: RGB for assets, Lightning for speed, Bitcoin for finality. They ship SDK, Cloud-managed RGB Lightning Nodes, Mint to bring USDT onto RGB, and Swap as a HotPot intent/RFQ. I haven’t shipped their internals — I’d start from public docs and a signet vertical slice.</p></div>`},
{section:"Utexo",html:`<span class="tag">Suite</span><h2>Cuatro productos</h2><table><tr><th>Producto</th><th>Job</th></tr><tr><td><strong>SDK</strong></td><td>USDT/RGB + LN en el cliente. Keys locales.</td></tr><tr><td><strong>Cloud</strong></td><td>Provisiona RLN. No es la API de pagos.</td></tr><tr><td><strong>Mint</strong></td><td>USDT cross-chain → RGB USDT <em>nativo</em>.</td></tr><tr><td><strong>Swap</strong></td><td>HotPot intent/RFQ. No es un AMM.</td></tr></table>`},
{section:"Utexo",html:`<span class="tag">Stack</span><h2>Capas</h2><ol><li><strong>Bitcoin</strong> — ancla / disputa</li><li><strong>Lightning</strong> — ejecución off-chain</li><li><strong>RGB</strong> — activos + client-side validation</li><li><strong>Utexo</strong> — routing, fees, SDK</li><li><strong>Mint / Swap</strong> — ingreso USDT · FX BTC↔USDT</li></ol><p class="muted">Mainnet RLN ≈ RGB on-chain. Lightning = testnet/beta. Mint LN dest = WIP.</p>`},
{section:"Utexo",html:`<span class="tag">APIs</span><h2>No las mezcles</h2><ul><li><strong>Cloud</strong> <span class="mono">cloud-api.thunderstack.org</span> — CRUD nodos</li><li><strong>RLN REST</strong> — invoices / channels / send</li><li><strong>Mint</strong> gateway — estimate, bridge-in, verify</li><li><strong>Swap</strong> partner <span class="mono">X-API-Key</span></li><li>“RGB Node API” del overview = <strong>404</strong>. No lo cites.</li></ul>`},

{section:"SDK",quiz:true,html:`<span class="tag">Trampa</span><p class="q">New Node.js integration in 2026 — which package, and why not rgb-sdk?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say"><span class="mono">@utexo/wdk-rgb-lightning</span>. <span class="mono">@utexo/rgb-sdk</span> was archived 28 Jul 2026. Don’t copy Web/RN <span class="mono">UTEXOWallet</span> APIs into WDK. Issuance is <span class="mono">@utexo/wdk-wallet-rgb</span> with a <em>separate</em> dataDir.</p></div>`},
{section:"SDK",html:`<span class="tag">WDK</span><h2>Lifecycle que debes narrar</h2><ol><li><span class="mono">WalletManagerRgbLightning(mnemonic, {network, dataDir})</span></li><li><span class="mono">getAccount(0)</span></li><li><span class="mono">unlock</span> — indexer <em>xor</em> bitcoind + proxy + announce</li><li>Peers → channels → invoices / RGB</li><li><span class="mono">manager.dispose()</span></li></ol>`},
{section:"SDK",html:`<span class="tag">RGB</span><h2>Vanilla vs colored · invoices</h2><div class="grid"><div class="card"><h3>Vanilla</h3><p>BTC path. Fund <span class="mono">getAddress()</span> then <span class="mono">createUtxos()</span>.</p></div><div class="card"><h3>Colored</h3><p>RGB allocations. Amounts = base units <span class="mono">10 ** precision</span>.</p></div></div><ul><li><strong>Blinded</strong> — común; no pases <span class="mono">witnessData</span></li><li><strong>Witness</strong> — sender pasa <span class="mono">witnessData.amountSats</span></li></ul>`},
{section:"SDK",html:`<span class="tag">Trampas</span><h2>Lista corta</h2><ul><li>Unlock con indexer <em>y</em> bitcoind — uno solo</li><li>Mismo <span class="mono">dataDir</span> para wallet-rgb y rgb-lightning</li><li>Init ≠ puedes pagar — falta peer/channel o LSP</li><li>VSS no replica VLS signer DB</li><li>APay outbound still in development</li><li>Fees “deterministic” — schedule completo no publicado. Mint = 0.03%</li></ul>`},

{section:"Lightning",quiz:true,html:`<span class="tag">90s</span><p class="q">What is Lightning, and why can a fat channel still fail?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">Lightning is a Bitcoin L2: lock BTC in a 2-of-2 channel, update balances off-chain with commitment txs. On-chain is open/close/dispute. Multi-hop uses HTLCs — preimage settles, timeout refunds. Capacity is pipe size; liquidity is direction. A huge channel fails if the split is wrong on some hop.</p></div>`},
{section:"Lightning",html:`<span class="tag">Números</span><h2>Alice paga 50k</h2><p>Capacity <strong>1,000,000</strong> · Alice 700k · Bob 300k · pago 50k.</p><div class="grid"><div class="card good"><h3>Después</h3><p>Alice <strong>650k</strong> · Bob <strong>350k</strong> · capacity igual.</p></div><div class="card"><h3>Línea</h3><p class="say">Capacity didn’t change — only the split did.</p></div></div>`},
{section:"Lightning",quiz:true,html:`<span class="tag">Debug</span><p class="q">BOLT11 fails no-route. Week-one debug?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">Reproduce with payment hash. Expiry and amount first. Then: no-route vs insufficient local outbound vs peer timeout. Local channels → attempted paths → fee budget. Sender vs forwarder vs receiver changes the checklist. Classify before restarting the node.</p></div>`},
{section:"Lightning",html:`<span class="tag">Fallos</span><h2>Misma UX, distinta causa</h2><table><tr><th>Síntoma</th><th>Causa</th></tr><tr><td>No route</td><td>Liquidez en un hop / amount / grafo</td></tr><tr><td>Pending</td><td>HTLC in-flight, peer offline</td></tr><tr><td>Can’t receive</td><td>Sin inbound</td></tr><tr><td>Force-close</td><td>Offline / no watchtower</td></tr></table><p class="say" style="margin-top:12px">I’d separate routing vs liquidity vs peer liveness.</p>`},
{section:"Lightning",html:`<span class="tag">Profund</span><h2>Si empujan</h2><ul><li><strong>Revocation</strong> — old commitment + justice if you broadcast stale state</li><li><strong>Watchtower</strong> — security assumes someone watches the chain</li><li><strong>Jamming</strong> — locked HTLCs; open research, not “solved”</li><li><strong>Force-close</strong> = incident class, not normal flow</li><li>Webhook: at-least-once · credit once per payment hash</li></ul>`},

{section:"RGB",quiz:true,html:`<span class="tag">60s</span><p class="q">What is RGB, and how does it meet Lightning?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">RGB is client-side validation for Bitcoin assets: you verify history for your UTXOs, not a global ERC-20 contract. Lightning moves value fast; RGB carries asset state in a Bitcoin-native design. I haven’t shipped RGB to production — week one is their WDK quickstart on the utexo signet plus a thin invoice→status slice.</p></div>`},
{section:"RGB",html:`<span class="tag">Contrast</span><h2>ERC-20 vs RGB</h2><table><tr><th></th><th>ERC-20</th><th>RGB</th></tr><tr><td>State</td><td>Global contract</td><td>Your coin history</td></tr><tr><td>Explorer</td><td>Public balances</td><td>Different disclosure</td></tr><tr><td>Speed</td><td>That chain’s L1/L2</td><td>Lightning</td></tr><tr><td>Ops</td><td>Familiar</td><td>Newer; backups harder</td></tr></table><p class="muted">No digas “anonymous”. Di different disclosure model.</p>`},
{section:"RGB",html:`<span class="tag">Riesgo</span><h2>Tres dominios. No los mezcles.</h2><div class="grid"><div class="card"><h3>1. Mint / bridge</h3><p>Lock-mint, TEE, issuance trust.</p></div><div class="card"><h3>2. Lightning ops</h3><p>Channels, liquidez, invoices.</p></div><div class="card"><h3>3. Custody</h3><p>Keys, freeze, compliance del partner.</p></div><div class="card warn"><h3>Línea</h3><p class="say">I’d never debug a mint failure with only LN pathfinding tools.</p></div></div>`},

{section:"Producto",quiz:true,html:`<span class="tag">PSP</span><p class="q">Why Bitcoin-native USDT for a PSP? Custody + fees?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">Stablecoin UX with Lightning speed and Bitcoin settlement topology. Fees pitched as configurable in USDT vs BTC spikes. I’d ask who holds keys, what “final” means — preimage vs RGB vs their ledger — and how success vs failure is billed. Cloud if they don’t want to be LN SRE; API if they already run infra.</p></div>`},
{section:"Producto",html:`<span class="tag">Definiciones</span><h2>Payment ≠ settlement</h2><p class="say">Payment is the user-visible send. Settlement is when the partner’s system of record treats it as final. UI can confirm in a second while finance waits for an idempotent payment.settled webhook keyed by payment hash.</p><p class="muted" style="margin-top:14px">Pregunta custody: keys · freeze after preimage · force-close DR · DB vs chain as source of truth.</p>`},

{section:"Fit",quiz:true,html:`<span class="tag">60s</span><p class="q">First two weeks — why keep you?</p><button class="reveal" type="button" data-reveal>Reveal</button><div class="answer hidden" data-answer><p class="say">Env + docs, then one vertical slice: invoice → webhook/status → notes. I’ll write a failure taxonomy so we stop saying Lightning failed. Daily written updates, early questions, small shipped work. Gap is production RGB/LN ops — I’ll close it by pairing and logging real SDK errors, not by bluffing.</p></div>`},
{section:"Fit",html:`<span class="tag">Cierre</span><h2>4 preguntas</h2><ol><li>Boosty staff-aug into Utexo, Utexo direct, or general Boosty Web3?</li><li>What does “strong after trial” look like in week 2 vs month 2?</li><li>Day-one stack: LN ops, RGB, backend API, or partner integrations?</li><li>Who is the tech expert and what product area do they own?</li></ol>`},
{section:"Fit",html:`<span class="tag">Crítico</span><h2>STAR está vacío</h2><p>Escribe <strong>2–3 stories reales</strong> en <span class="mono">04-star-stories.md</span> esta noche. No uses los samples de <span class="mono">06</span> — son ficción.</p><ul><li>Integración ambigua (API / webhook)</li><li>Incidente / idempotencia / reconciliación</li><li>Lo más cercano a payments / crypto</li></ul><p class="muted">S 1 frase · T tuya · A 2–4 pasos · R métrica. 90s.</p>`},

{section:"Mock",html:`<span class="tag">10 min</span><h2>Script del screen</h2><ol><li>Lightning + fat channel still fails</li><li>No-route debug</li><li>PSP / custody / fees</li><li>RGB + Lightning + honest gap</li><li>STAR payments/API</li><li>Trial week 1–2</li><li>Tus preguntas</li></ol><p class="muted">Timer. Voz alta. Luego otra vez solo los que tartamudeaste.</p>`},
{section:"Mock",html:`<span class="tag">Never</span><h2>No salgas por aquí</h2><ul><li>“I built Utexo / I ran their mainnet LN”</li><li>“RGB is anonymous”</li><li>“Swap is an AMM”</li><li>“Cloud API pays invoices”</li><li>“I’ll just learn fast” sin plan</li><li>Inventar endpoints o el fee schedule</li></ul><p class="say" style="margin-top:12px">Always: capacity ≠ liquidity · classify failures · ask what final means · state the RGB gap.</p>`}
];
const main=document.getElementById('main'),prog=document.getElementById('prog'),counter=document.getElementById('counter'),sectionsEl=document.getElementById('sections'),btnQuiz=document.getElementById('btnQuiz');
let i=0,quizMode=true,touchX=null;
[...new Set(slides.map(s=>s.section))].forEach(name=>{const b=document.createElement('button');b.className='sec';b.type='button';b.textContent=name;b.dataset.section=name;b.onclick=()=>{i=slides.findIndex(s=>s.section===name);render()};sectionsEl.appendChild(b)});
function render(){const slide=slides[i];main.innerHTML=`<article class="slide">${slide.html}</article>`;counter.textContent=`${i+1} / ${slides.length}`;prog.style.width=`${((i+1)/slides.length)*100}%`;[...sectionsEl.children].forEach(el=>el.classList.toggle('on',el.dataset.section===slide.section));document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;bindReveal();applyQuiz()}
function bindReveal(){main.querySelectorAll('[data-reveal]').forEach(btn=>btn.addEventListener('click',()=>{const ans=btn.parentElement.querySelector('[data-answer]');if(!ans)return;ans.classList.remove('hidden');btn.remove()}))}
function applyQuiz(){btnQuiz.classList.toggle('primary',quizMode);btnQuiz.textContent=quizMode?'Quiz on':'Quiz';main.querySelectorAll('[data-answer]').forEach(ans=>{if(quizMode&&slides[i].quiz){ans.classList.add('hidden');if(!ans.parentElement.querySelector('[data-reveal]')){const btn=document.createElement('button');btn.className='reveal';btn.type='button';btn.dataset.reveal='1';btn.textContent='Reveal — di tu versión primero';ans.before(btn);bindReveal()}}})}
function next(){if(i<slides.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;btnQuiz.onclick=()=>{quizMode=!quizMode;render()};document.getElementById('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}if(e.key==='h'||e.key==='H'){quizMode=!quizMode;render()}if(e.key==='f'||e.key==='F')document.getElementById('btnFs').click()});
main.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});main.addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].screenX-touchX;touchX=null;if(Math.abs(dx)<50)return;if(dx<0)next();else prev()},{passive:true});
render();
</script>
</body>
